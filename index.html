<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trail des Awirs 2026</title>

<!-- Description pour Google et partage sur réseaux sociaux -->
<meta name="description" content="Trail des Awirs 2026 — 22 août, Flémalle. Trois parcours (6, 12, 21 km) sur les sentiers vallonnés des Awirs.">

<!-- Connexions anticipées aux serveurs externes pour charger les polices plus vite -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- Polices Google Fonts : Bebas Neue (titres), DM Sans (texte courant) -->
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Open Graph : informations affichées lors du partage sur réseaux sociaux -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://glem4ire.github.io/trail-des-awirs/">
<meta property="og:title" content="Trail des Awirs 2026 — 22 août · Flémalle">
<meta property="og:description" content="Trail des Awirs 2026 — 22 août, Flémalle. Trois parcours (6, 12, 21 km) sur les sentiers vallonnés des Awirs.">
<meta property="og:image" content="https://glem4ire.github.io/trail-des-awirs/img/background.jpg">
<meta property="og:locale" content="fr_BE">
<meta property="og:locale:alternate" content="nl_BE">

<!-- Favicon — petite icône affichée dans l'onglet du navigateur -->
<link rel="icon" type="image/svg+xml" href="img/logo_tda.svg">

<!-- Feuille de styles principale -->
<link rel="stylesheet" href="style.css">

</head>
<body>

<!-- NAVIGATION FIXE — Logo à gauche, bouton langue à droite -->
<nav>
  <!-- Logo du site dans la navigation -->
  <a href="#" class="nav-logo">
    <svg class="nav-logo-img" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <!-- Le logo est un SVG simple : cercle avec "TDA" à l'intérieur -->
      <circle cx="100" cy="100" r="95" fill="none" stroke="currentColor" stroke-width="2" opacity="0.3"/>
      <text x="100" y="115" font-family="Bebas Neue, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="currentColor">TDA</text>
    </svg>
  </a>

  <!-- Bouton pour changer la langue (FR/NL) -->
  <div class="nav-right">
    <button class="lang-toggle" onclick="toggleLang()" title="Toggle language">
      <span data-i18n="waiting.lang">FR</span>
    </button>
  </div>
</nav>

<!-- CONTENU PRINCIPAL — Page d'attente (waiting screen) -->
<main class="waiting-screen">
  <!-- Fond topographique subtil en arrière-plan -->
  <div class="topo-bg"></div>

  <!-- Contenant principal centré -->
  <div class="waiting-container">
    <!-- Logo grande taille au centre -->
    <div class="waiting-logo">
      <svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
        <!-- Cercle externe du logo -->
        <circle cx="150" cy="150" r="140" fill="none" stroke="currentColor" stroke-width="3" opacity="0.4"/>
        <!-- Cercle moyen du logo -->
        <circle cx="150" cy="150" r="120" fill="none" stroke="currentColor" stroke-width="2" opacity="0.3"/>
        <!-- Texte "TDA" au centre -->
        <text x="150" y="170" font-family="Bebas Neue, sans-serif" font-size="80" font-weight="bold" text-anchor="middle" fill="currentColor">TDA</text>
      </svg>
    </div>

    <!-- Titre du trail -->
    <h1 class="waiting-title" data-i18n="waiting.title">
      TRAIL<br>DES<br>AWIRS
    </h1>

    <!-- Informations : date et lieu -->
    <div class="waiting-info">
      <!-- Date de l'événement -->
      <div class="info-item">
        <span class="info-label" data-i18n="waiting.date-label">Date</span>
        <span class="info-value" data-i18n="waiting.date">22 Août 2026</span>
      </div>

      <!-- Lieu de l'événement -->
      <div class="info-item">
        <span class="info-label" data-i18n="waiting.location-label">Lieu</span>
        <span class="info-value" data-i18n="waiting.location">Flémalle, Belgique</span>
      </div>
    </div>

    <!-- Message d'attente -->
    <p class="waiting-message" data-i18n="waiting.coming-soon">
      Plus d'informations bientôt
    </p>

    <!-- Texte descriptif optionnel -->
    <p class="waiting-description" data-i18n="waiting.description">
      Restez à l'écoute pour les détails complets
    </p>
  </div>
</main>

<!-- ============================================================
     Scripts JavaScript
     ============================================================ -->

<!-- Traductions en français et néerlandais -->
<script src="translations.js"></script>

<!-- Script pour gérer les traductions et le changement de langue -->
<script>
// Fonction pour changer la langue du site
function toggleLang() {
  // Récupère la langue actuelle depuis localStorage (par défaut "fr")
  const currentLang = localStorage.getItem('trail-lang') || 'fr';
  // Bascule entre FR et NL
  const newLang = currentLang === 'fr' ? 'nl' : 'fr';
  // Applique la nouvelle langue et la sauvegarde
  setLang(newLang);
}

// Fonction pour appliquer une langue
function setLang(lang) {
  // Sauvegarde le choix de langue dans localStorage pour que ça persiste
  localStorage.setItem('trail-lang', lang);

  // Applique les traductions à tous les éléments avec data-i18n
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    // Récupère la traduction, sinon garde le texte existant
    if (translations[lang] && translations[lang][key]) {
      el.innerHTML = translations[lang][key];
    }
  });

  // Change l'attribut lang du HTML pour que les navigateurs adaptent la langue
  document.documentElement.lang = lang === 'nl' ? 'nl' : 'fr';

  // Met à jour l'affichage du bouton langue
  updateLangButton();
}

// Fonction pour mettre à jour l'affichage du bouton langue
function updateLangButton() {
  const currentLang = localStorage.getItem('trail-lang') || 'fr';
  const button = document.querySelector('.lang-toggle');
  if (button) {
    // Affiche "NL" si en FR, "FR" si en NL
    button.querySelector('[data-i18n]').textContent = currentLang === 'fr' ? 'NL' : 'FR';
  }
}

// Au chargement de la page, applique la langue sauvegardée
document.addEventListener('DOMContentLoaded', () => {
  const savedLang = localStorage.getItem('trail-lang') || 'fr';
  setLang(savedLang);
});
</script>

</body>
</html>
